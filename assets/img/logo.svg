<!-- RAWÂJ brand mark.
     A peak (^) with an echo below it. The peak is the Â in RAWÂJ, and the
     widening echo is the "رواج" - reach spreading outward. Drawn as two
     nested chevrons rather than a chart line so it still reads at 16px in a
     favicon, where a multi-segment line turns to mush.
     Palette is the same teal as the ad so the favicon and the poster match. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RAWÂJ">
  <defs>
    <linearGradient id="rawajMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#5EEAD4"/>
      <stop offset="55%"  stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#rawajMark)"/>

  <!-- the peak -->
  <path d="M15 40 L32 25.5 L49 40"
        fill="none" stroke="#04211F" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- the echo: same shape, wider and quieter -->
  <path d="M15 50 L32 35.5 L49 50"
        fill="none" stroke="#04211F" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
</svg>
